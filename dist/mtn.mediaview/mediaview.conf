# mediaview.conf - overrides for libmpv (option=value, mpv option names).
# Applied after the built-in defaults when a viewer tab opens; no rebuild.

# Verbosity of mpv's log echoed to DebugView: error / warn / info / v.
#log-level=v

# Built-in defaults worth knowing (uncomment to change):
#hwdec=d3d11va          # d3d11va-copy / no as alternatives
#video-sync=audio       # the display-* modes misjudge the refresh rate in an embedded window - avoid
#osd-font-size=32

# Files inside archives and on sftp are opened through MTN2 (it copies them to
# temporary files of its own). Around the current file the plugin opens ahead /
# keeps open:
#cache-next=2           # files after the current one
#cache-prev=2           # files before it
#cache-max-mb=256       # total size of them; farther files give way first
